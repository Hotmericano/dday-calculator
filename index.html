<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공군 전역일 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>공군 전역일 계산기</h1>
      <p class="subtitle">입대일을 고르면 바로 계산돼요</p>
    </header>

    <section class="card input-card">
      <label for="start">입대일</label>
      <input type="date" id="start">
    </section>

    <p id="message" class="message"></p>

    <div id="result" class="result" hidden>
      <!-- 전역일 & 전체 복무 진행률 -->
      <section class="card summary-card">
        <p class="label">전역까지</p>
        <p id="dday" class="dday"></p>
        <p id="end-date" class="end-date"></p>

        <div class="progress">
          <div id="total-bar" class="progress-bar"></div>
        </div>
        <div class="progress-info">
          <span id="total-percent"></span>
          <span id="total-days"></span>
        </div>
      </section>

      <!-- 계급별 진급일 & 진행률 -->
      <section class="card">
        <h2 id="rank-title" class="rank-title"></h2>
        <ul id="ranks" class="rank-list"></ul>
      </section>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
